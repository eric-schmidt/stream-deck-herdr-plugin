name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`: bun rewrites bun.lock when its lockfile format moves, and an
      # unpinned runner would make that churn show up as a CI-only diff.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install

      - name: Test
        run: bun test

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      # `streamdeck pack` writes manifest.json with no trailing newline; editors put one
      # back. .editorconfig asks them not to, but that is a convention an editor may ignore,
      # so this is the part that actually holds. If it fails, strip the last byte again:
      #   printf '%s' "$(cat <manifest>)" > <manifest>
      - name: manifest.json keeps the format `streamdeck pack` writes
        run: |
          manifest=dev.timvdhoorn.herdr-agents.sdPlugin/manifest.json
          if [ -z "$(tail -c 1 "$manifest")" ]; then
            echo "::error file=$manifest::manifest.json has regained a trailing newline; \
          streamdeck pack strips it, so this will flip back and ride along in an unrelated commit"
            exit 1
          fi
